name: Tests

on:
  push:
    branches:
      - main
      - improvement
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Reference server and wire-protocol conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run server tests
        run: npm run test:server

  firebase:
    name: Firebase transport (emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Security rules and wire-protocol conformance
        run: npm run test:firebase
      - name: Live sync in two browsers
        run: npm run test:firebase:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: firebase-test-results
          path: |
            test-results/
            firebase-debug.log
            firestore-debug.log
          retention-days: 14

  test:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Desktop browsers are the compatibility gate (all three must pass).
        # Mobile/tablet are best-effort and allowed to fail until they are
        # stabilized.
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
